# config/services.yaml
parameters:
    stripe.secret_key: "%env(STRIPE_SECRET_KEY)%"
    app.admin_email: "%env(APP_ADMIN_EMAIL)%"
    app.mail_from: "julien-dev@alwaysdata.net"
    app.mail_from_name: "Boutique InnovShop"
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"
